name: ValiNum v2 - Tests & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test ValiNum v2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify distribution files
        run: |
          set -e

          echo "=== Vérification de dist/ ==="

          test -f dist/valinum.js
          test -f dist/valinum.min.js
          test -f dist/valinum.mjs
          test -f dist/valinum.cjs

          echo "✓ dist/valinum.js"
          echo "✓ dist/valinum.min.js"
          echo "✓ dist/valinum.mjs"
          echo "✓ dist/valinum.cjs"

          echo ""
          echo "=== Distribution ValiNum ==="
          ls -lh dist/

          echo ""
          echo "✓ Tous les fichiers de distribution sont présents."

      # dist/ is committed so that CDNs (jsDelivr, unpkg) can serve
      # it straight from GitHub: it must match the sources.
      - name: Check that committed dist/ is up to date
        run: |
          UNTRACKED="$(git ls-files --others --exclude-standard -- dist)"

          if ! git diff --quiet -- dist || [ -n "$UNTRACKED" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            [ -n "$UNTRACKED" ] && echo "Not committed:" && echo "$UNTRACKED"
            exit 1
          fi

          echo "✓ dist/ correspond aux sources."