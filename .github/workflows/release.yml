name: Automatic Production Release & NPM Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Production Release Setup
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install full workspace dependencies
        run: npm ci

      - name: Strict verification of test suite
        run: npx vitest run

      - name: Build production artifact
        run: npm run build

      - name: Create production distribution artifact
        id: package_artifact
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "Detected version: $TAG_VERSION"

          mkdir -p release-artifacts

          ZIP_NAME="valinum-${TAG_VERSION}-dist.zip"
          zip -r "release-artifacts/${ZIP_NAME}" dist/

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-artifacts/${{ steps.package_artifact.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_VALINUM }}